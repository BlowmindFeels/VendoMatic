<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">VEND<span>O</span>MATIC</div>
      <p class="login-subtitle">Gestión de Máquinas Expendedoras</p>
    </div>

    <form id="loginForm" class="login-form">
      <div class="login-field">
        <label for="username">Usuario</label>
        <input type="text" id="username" placeholder="Ingresa tu usuario" required autocomplete="username">
      </div>
      <div class="login-field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
      </div>
      <div id="loginError" class="login-error hidden">Usuario o contraseña incorrectos</div>
      <button type="submit" class="btn btn-primary login-btn" id="loginBtn">Ingresar</button>
    </form>

    <div class="login-hint">
      <span class="badge badge-blue">admin</span> admin123 &nbsp;·&nbsp;
      <span class="badge badge-green">usuario</span> user123
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      const err = document.getElementById("loginError");
      btn.textContent = "Ingresando...";
      btn.disabled    = true;
      err.classList.add("hidden");

      const res = await fetch("/auth/login", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        }),
      });

      if (res.ok) {
        const { rol } = await res.json();
        location.href = rol === "admin" ? "/index.html" : "/selector.html";
      } else {
        err.classList.remove("hidden");
        btn.textContent = "Ingresar";
        btn.disabled    = false;
      }
    });
  </script>
</body>
</html>
